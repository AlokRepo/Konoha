<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konoha Gallery Explorer</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --accent: #6366f1;
            --text: #ffffff;
            --pending: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 85vh;
            overflow: hidden;
            background: #000;
            z-index: -1;
        }

        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg) 5%, transparent 40%);
        }

        #banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #banner.loaded {
            opacity: 1;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            height: 100vh;
            width: 100%;
            padding: 40px 50px;
            box-sizing: border-box;
            z-index: 10;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            width: 300px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
        }

        .search-box input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 1rem;
        }

        .main-view {
            display: flex;
            gap: 30px;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        #poster {
            width: 200px;
            height: 300px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            object-fit: cover;
            background: var(--card-bg);
            transition: transform 0.4s ease;
        }

        .info {
            text-align: left;
            background: rgba(10, 10, 12, 0.6);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 600px;
        }

        h1 { margin: 0; font-size: 2.5rem; line-height: 1.1; }
        .meta { color: #94a3b8; margin: 15px 0; font-size: 1.1rem; display: flex; gap: 15px; }
        .ids { display: flex; gap: 10px; margin-top: 15px; }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
            color: #cbd5e1;
        }
        .badge.verified { background: var(--accent); color: white; }
        .badge.pending { background: var(--pending); color: black; }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 25px;
            border-radius: 30px;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .slider-container {
            width: 100%;
            overflow-x: auto;
            padding: 20px 0;
            display: flex;
            gap: 15px;
            scrollbar-width: none;
        }
        .slider-container::-webkit-scrollbar { display: none; }

        .slide-item {
            flex: 0 0 100px;
            height: 150px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            opacity: 0.5;
        }

        .slide-item.active {
            border-color: var(--accent);
            transform: translateY(-5px);
            opacity: 1;
        }

        .slide-item img { width: 100%; height: 100%; object-fit: cover; }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="hero">
        <img id="banner" src="" alt="">
    </div>

    <div class="content">
        <div class="top-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search library (Enter to jump)..." oninput="handleSearch()">
            </div>
            <div id="counter">0 / 0</div>
        </div>

        <div class="main-view">
            <img id="poster" src="" alt="Anime Poster">
            <div class="info">
                <h1 id="title">Loading...</h1>
                <div class="meta" id="meta"></div>
                <div class="ids" id="ids"></div>
                <div class="controls">
                    <button onclick="prev()">Previous</button>
                    <button onclick="random()">Random 🎲</button>
                    <button onclick="next()">Next</button>
                </div>
            </div>
        </div>

        <div class="slider-container" id="slider"></div>
    </div>

    <script>
        let indexData = [];
        let searchIndex = [];
        let currentIndex = 0;

        async function init() {
            try {
                const [resIndex, resSearch] = await Promise.all([
                    fetch('./data/index.json'),
                    fetch('./data/search.json').catch(() => null)
                ]);

                indexData = await resIndex.json();
                if (resSearch) searchIndex = await resSearch.json();
                
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').remove(), 500);

                if (indexData.length > 0) {
                    buildSlider();
                    render();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('title').innerText = "Error loading data.";
            }
        }

        function buildSlider() {
            const slider = document.getElementById('slider');
            slider.innerHTML = '';
            indexData.forEach((anime, i) => {
                const item = document.createElement('div');
                item.className = `slide-item ${i === currentIndex ? 'active' : ''}`;
                item.id = `slide-${i}`;
                item.onclick = () => { currentIndex = i; render(); };
                item.innerHTML = `<img src="${anime.poster}" alt="">`;
                slider.appendChild(item);
            });
        }

        async function render() {
            const anime = indexData[currentIndex];
            
            // Update slider
            document.querySelectorAll('.slide-item').forEach(el => el.classList.remove('active'));
            const activeSlide = document.getElementById(`slide-${currentIndex}`);
            if (activeSlide) {
                activeSlide.classList.add('active');
                activeSlide.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            try {
                const res = await fetch(`./data/anime/${anime.id}/index.json`);
                const full = await res.json();

                const bannerImg = document.getElementById('banner');
                bannerImg.classList.remove('loaded');
                bannerImg.src = full.images.banner_tmdb || full.images.banner || '';
                bannerImg.onload = () => bannerImg.classList.add('loaded');

                document.getElementById('poster').src = full.images.poster_tmdb || full.images.poster || '';
                document.getElementById('title').innerText = full.titles.english || full.titles.romaji || full.titles.native;
                
                document.getElementById('meta').innerHTML = `
                    <span>${full.season || ''} ${full.season_year || ''}</span>
                    <span>•</span>
                    <span>${full.format || ''}</span>
                    <span>•</span>
                    <span>${full.episodes || '?'} Episodes</span>
                `;

                document.getElementById('ids').innerHTML = `
                    <div class="badge verified">AL:${full.ids.anilist}</div>
                    ${full.ids.mal ? `<div class="badge">MAL:${full.ids.mal}</div>` : ''}
                    ${full.ids.tmdb ? `<div class="badge">TMDB:${full.ids.tmdb}</div>` : ''}
                    ${full.confidence === 'HIGH' ? '<div class="badge verified">Verified</div>' : '<div class="badge pending">Review Needed</div>'}
                `;

                document.getElementById('counter').innerText = `${currentIndex + 1} / ${indexData.length}`;
            } catch (e) {
                console.error(e);
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) return;

            const foundIndex = indexData.findIndex(a => a.title.toLowerCase().includes(query));
            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                render();
            }
        }

        function next() { currentIndex = (currentIndex + 1) % indexData.length; render(); }
        function prev() { currentIndex = (currentIndex - 1 + indexData.length) % indexData.length; render(); }
        function random() { currentIndex = Math.floor(Math.random() * indexData.length); render(); }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') next();
            if (e.key === 'ArrowLeft') prev();
        });

        init();
    </script>
</body>
</html>
